services:
  dsh:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost:8080}
    volumes:
      - dsh-data:/home/node/.dsh
      - ${WORKSPACE:-./workspace}:/workspace

volumes:
  dsh-data:
