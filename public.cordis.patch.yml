- id: webserver
  config:
    host: 0.0.0.0
    port: !!js Number(process.env.PORT ?? 8080)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js "[process.env.PUBLIC_HOST]"
